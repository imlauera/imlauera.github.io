  <h1>Como copiar y pegar usando Screen a vim desde la TTY</h1>
  <p class="meta">
    <time datetime="2025-01-28">2025-01-28</time>
    <span class="tags"> · <a href="/tags/tty/">tty</a></span>
  </p>
  <div class="content">
    <p><code>screen</code>
<code>Ctrl + a + [</code></p>
<p>Seleccionás el texto con las flechas y dale a enter o a space<br>
Ahora abrí vim escribí <code>:set paste</code><br>
Entra en insert mode<br>
Pegá el texto con <code>Ctrl + a + ]</code></p>
